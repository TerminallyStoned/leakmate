# Benign traffic hosts (card 7). Depends on the testbed network from card 5, which is
# created externally — set TESTBED_NETWORK to its name. Each replica is a distinct
# src_host with a distinct source IP, and its dns: is pinned to the resolver where the
# capture runs, so every lookup lands in the pcap.
#
#   RESOLVER_IP=10.20.0.2 TESTBED_NETWORK=ict3214_testbed \
#     ./run_benign.sh --hosts 4 --minutes 10 --docker
services:
  benign:
    build: .
    image: leakmate-benign:latest
    dns: ["${RESOLVER_IP:-10.20.0.2}"]
    networks: [testbed]
    command:
      - --minutes
      - "${BENIGN_MINUTES:-10}"
      - --target-qps
      - "${BENIGN_TARGET_QPS:-10}"
      - --engines
      - "${BENIGN_ENGINES:-dns,cdn,page,curl,apt}"
      - --out
      - /out
    environment:
      RESOLVER_IP: "${RESOLVER_IP:-}"
      BENIGN_SEED: "${BENIGN_SEED:-}"
    volumes:
      - ${BENIGN_OUT:-./out}:/out
    # Tranco is fetched once and cached; the offline fallback list keeps runs working
    # when the testbed has no upstream DNS.
    restart: "no"

networks:
  testbed:
    name: "${TESTBED_NETWORK:-ict3214_testbed}"
    external: true
