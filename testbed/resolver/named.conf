options {
    directory "/var/cache/bind";

    // Act as a recursive resolver for the victims on the lab network.
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };

    // Legitimate lookups go upstream to a public resolver.
    forwarders { 1.1.1.1; 8.8.8.8; };

    // Keep the testbed simple/deterministic.
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

// Per-tool subdomains are delegated (by forwarding) to each tool's own server
// container, so every tool's queries are labelled by destination domain too.
// More-specific zones win, so i.tunnel.test goes to the iodine server while the
// rest of tunnel.test still goes to the generic attacker NS below.
zone "i.tunnel.test" {
    type forward;
    forward only;
    forwarders { 172.28.0.20; };   // iodine-server
};

zone "d.tunnel.test" {
    type forward;
    forward only;
    forwarders { 172.28.0.21; };   // dnscat2-server
};

// The key containment control: tunnel.test is forwarded ONLY to the internal
// attacker name server, never upstream. So no tunnel.test query ever leaves.
zone "tunnel.test" {
    type forward;
    forward only;
    forwarders { 172.28.0.3; };
};
