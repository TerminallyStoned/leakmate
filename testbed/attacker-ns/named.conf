options {
    directory "/var/cache/bind";

    // Authoritative only. This server does not resolve anything on the internet.
    recursion no;
    allow-query { any; };

    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

// Authoritative for the fake, unregistered test domain.
zone "tunnel.test" {
    type master;
    file "/etc/bind/db.tunnel.test";
};
