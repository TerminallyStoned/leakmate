name: ict3214-testbed

# Two networks:
#   lab      -> internal:true, NO route to the internet. Holds the victim(s)
#               and the attacker-controlled authoritative server. Tunnel traffic
#               for tunnel.test lives here and cannot leave.
#   upstream -> normal bridge with internet. ONLY the resolver is attached to it,
#               so only legitimate (non-test) lookups are forwarded out.
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
  upstream:
    driver: bridge

services:
  # Attacker-controlled authoritative name server for tunnel.test.
  # Later (card #6) the tunnel tool servers (iodined, dnscat2) live behind this.
  attacker-ns:
    image: internetsystemsconsortium/bind9:9.20
    container_name: attacker-ns
    # No command override: the image's entrypoint is already `named`, and its
    # default args run `named -c /etc/bind/named.conf` on the config we mount.
    volumes:
      - ./attacker-ns:/etc/bind:ro
    networks:
      lab:
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  # Recursive resolver the victims point at.
  # Forwards tunnel.test -> attacker-ns (stays internal); everything else -> 1.1.1.1.
  resolver:
    image: internetsystemsconsortium/bind9:9.20
    container_name: resolver
    # No command override (see attacker-ns).
    volumes:
      - ./resolver:/etc/bind:ro
    networks:
      lab:
        ipv4_address: 172.28.0.2
      upstream:
    depends_on:
      - attacker-ns
    restart: unless-stopped

  # A victim host. DNS is pointed at the resolver. No internet of its own.
  victim:
    build: ./victim
    container_name: victim
    command: ["sleep", "infinity"]
    dns:
      - 172.28.0.2
    networks:
      lab:
        ipv4_address: 172.28.0.10
    depends_on:
      - resolver
    restart: unless-stopped

  # Benign traffic hosts (card #7). Gated behind a profile so `docker compose up -d`
  # above is unchanged; start it with the helper instead:
  #   testbed/benign/run_benign.sh --hosts 4 --minutes 10 --docker
  # No ipv4_address: compose assigns one per replica, which is what --scale needs.
  # --no-http because `lab` is internal: true, so only the DNS itself leaves via the
  # resolver; the lookups are what the capture measures.
  benign:
    profiles: ["benign"]
    build: ./benign
    image: leakmate-benign:latest
    depends_on:
      - resolver
    dns:
      - "${RESOLVER_IP:-172.28.0.2}"
    networks:
      lab:
    command:
      - --minutes
      - "${BENIGN_MINUTES:-10}"
      - --target-qps
      - "${BENIGN_TARGET_QPS:-30}"
      - --engines
      - "${BENIGN_ENGINES:-dns,cdn,page,curl,apt}"
      - --out
      - /out/
      - --no-http
    volumes:
      # Tranco cache lives on the host: the lab has no route to fetch it from a container.
      - ../data/external:/app/data/external
      - ${BENIGN_OUT:-./out/benign}:/out
    restart: "no"
