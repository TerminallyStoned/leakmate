# dns2tcpd for the lab (card #8). Format is dns2tcp 0.5.2's own, from
# /usr/share/doc/dns2tcp/examples/dns2tcpd.conf: `resources = <name>:<host>:<port>`,
# and the client picks a resource with `-r <name>`. run_tool.sh opens `http` from a second
# container and pushes --size bytes through it, so a capture contains a TCP transfer whose
# DNS bootstrap is visible alongside it.
#
# `listen` is 0.0.0.0 so the tool answers the client container over the internal lab
# network; the zone below is only ever resolved by that client, whose resolver is this
# container (testbed/tools/docker-compose.yml).
#
# `key` is dns2tcp's pre-shared key: it makes the handshake real, it is not a secret on a
# contained network with no route anywhere.
listen = 0.0.0.0
port = 53
domain = dns2tcp.tunnel.test
resources = http:127.0.0.1:8080
key = leakmate-lab
